services:
  - type: web
    name: callytix
    runtime: python
    buildCommand: pip install -r requirements-render.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: WEB_CONCURRENCY
        value: "1"
      - key: WHISPER_MODEL
        value: tiny
